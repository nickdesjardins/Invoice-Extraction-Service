[pytest]
# pytest-asyncio asks for this to be stated. "function" is how the suite has always
# run: every test gets an event loop of its own.
asyncio_default_fixture_loop_scope = function
# A test that stands still for two minutes prints where every thread stands, so that a
# run that hangs on a busy machine or on GitHub says which test it was. Nothing fails.
faulthandler_timeout = 120
